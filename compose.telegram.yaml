services:
  telegram-ingress:
    build: .
    command: ["python", "-m", "scripts.telegram_ingress"]
    environment:
      TELEGRAM_INGRESS_BIND: 0.0.0.0
      TELEGRAM_INGRESS_UPSTREAM: http://api:8000
    networks: [default, telegram-edge]
    restart: unless-stopped
    depends_on:
      api: {condition: service_started}
  telegram-ngrok:
    image: ngrok/ngrok@sha256:ff3b5c3674432d14a786349908b7bdf28ee56c25662637afcbe7180d471993ef
    command:
      - http
      - http://telegram-ingress:18081
      - "--url=https://${NGROK_DOMAIN:?Set NGROK_DOMAIN in .env}"
      - "--inspect=false"
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:?Set NGROK_AUTHTOKEN in .env}
    networks: [telegram-edge]
    restart: unless-stopped
    depends_on:
      telegram-ingress: {condition: service_started}
  telegram-monitor:
    build: .
    command: ["python", "-m", "scripts.monitor_telegram"]
    environment:
      DATABASE_URL: postgresql+psycopg://servicedesk@db:5432/servicedesk
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN:?Set TELEGRAM_TOKEN in .env}
      TELEGRAM_ALERT_CHAT_ID: ${TELEGRAM_ALERT_CHAT_ID:?Set TELEGRAM_ALERT_CHAT_ID in .env}
      TELEGRAM_PUBLIC_WEBHOOK: https://${NGROK_DOMAIN}/integrations/telegram/webhook
      TELEGRAM_QUEUE_ALERT_COUNT: ${TELEGRAM_QUEUE_ALERT_COUNT:-10}
      TELEGRAM_QUEUE_ALERT_AGE_SECONDS: ${TELEGRAM_QUEUE_ALERT_AGE_SECONDS:-120}
    restart: unless-stopped
    depends_on:
      migrate: {condition: service_completed_successfully}

networks:
  telegram-edge:
