name: CI

on: pull_request

permissions:
  contents: read

jobs:
  postgres:
    name: Migrations and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: servicedesk_ci
          POSTGRES_USER: servicedesk
          POSTGRES_PASSWORD: ci-only
        ports:
          - '5432:5432'
        options: >-
          --health-cmd "pg_isready -U servicedesk -d servicedesk_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://servicedesk:ci-only@127.0.0.1:5432/servicedesk_ci
      TEST_DATABASE_URL: postgresql+psycopg://servicedesk:ci-only@127.0.0.1:5432/servicedesk_ci
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Verify database migrations
        run: |
          python -m alembic upgrade head
          python -m alembic current --check-heads
      - name: Run full test suite
        run: python -m pytest -q -rs
