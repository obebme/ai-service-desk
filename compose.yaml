services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: servicedesk
      POSTGRES_USER: servicedesk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports: ["127.0.0.1:5433:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U servicedesk -d servicedesk"]
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    build: .
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+psycopg://servicedesk:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/servicedesk
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db: {condition: service_healthy}
  api:
    build: .
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+psycopg://servicedesk:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/servicedesk
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-}
    ports: ["127.0.0.1:8000:8000"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live')"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 20s
    depends_on:
      db: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
  n8n:
    image: n8nio/n8n:latest
    profiles: [automation]
    ports: ["127.0.0.1:5678:5678"]
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Set N8N_ENCRYPTION_KEY in .env}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
    volumes: ["n8ndata:/home/node/.n8n"]
    restart: unless-stopped
volumes:
  pgdata:
  n8ndata:
